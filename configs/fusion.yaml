# 融合模块配置文件

model:
  feature_2d_dim: 256
  feature_3d_dim: 128
  hidden_dim: 256
  num_layers: 4

training:
  batch_size: 4
  num_epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0001

data:
  anovox_root: "data/anovox"
  split: "train"

checkpoints:
  semantic_2d: "outputs/semantic_2d/model_final.pth"
  geometric_3d: "outputs/geometric_3d/model_final.pth"
  semantic_config: "RbA/configs/cityscapes/semantic-segmentation/swin/single_decoder_layer/maskformer2_swin_base_IN21k_384_bs16_90k_1dl.yaml"

output:
  checkpoint_dir: "outputs/fusion"

